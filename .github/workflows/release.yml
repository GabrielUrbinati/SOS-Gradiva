name: Build and Release Android App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # <--- Adiciona esta linha para permitir disparo manual

jobs:
  build:
    name: Compilar APK e AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar Dependências e Capacitor
        run: |
          npm install
          npx cap update android

      - name: Gerar APK e Bundle no Android
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew bundleDebug

      - name: Subir Ficheiros para a Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/debug/app-debug.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}