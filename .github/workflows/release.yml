name: Build and Release Android App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias, gerar build web e sincronizar Capacitor
        run: |
          npm install
          npm run build --if-present
          node ./node_modules/@capacitor/cli/bin/capacitor update android

      - name: Gerar APK e Bundle no Android
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          ./gradlew bundleDebug --no-daemon

      - name: Upload APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB Debug
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-bundle
          path: android/app/build/outputs/bundle/debug/app-debug.aab
