<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gradiva - Instituto de Saúde & Prontuário Clínico</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- CryptoJS para Criptografia de Dados Sensíveis (LGPD / CFP) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <!-- QRCode Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta+Sans', sans-serif; }
    </style>
</head>
<body class="bg-teal-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = React.useState('patient');
            
            // Estado do Paciente / Aluno (Gradiva)
            const [name, setName] = React.useState('Beatriz Helena de Souza');
            const [recordId, setRecordId] = React.useState('GDV-2026-9042');
            const [program, setProgram] = React.useState('Acompanhamento Psicoterapêutico & Clínico');
            const [therapist, setTherapist] = React.useState('Dra. Helena Martins (CRP 08/12345)');
            const [notes, setNotes] = React.useState('Evolução estável. Próxima sessão presencial agendada para terça-feira às 14h.');
            const [secretPin, setSecretPin] = React.useState('Gradiva2026');
            const [encryptedPayload, setEncryptedPayload] = React.useState('');

            // Estado do Terminal Profissional / Terapeuta
            const [inputPayload, setInputPayload] = React.useState('');
            const [inputPin, setInputPin] = React.useState('Gradiva2026');
            const [decryptedData, setDecryptedData] = React.useState(null);
            const [auditLog, setAuditLog] = React.useState('');

            // Referência para o QR Code
            const qrRef = React.useRef(null);

            const handleEncryptAndGenerate = () => {
                const data = { name, recordId, program, therapist, notes, ts: new Date().toISOString() };
                try {
                    const ciphertext = CryptoJS.AES.encrypt(JSON.stringify(data), secretPin).toString();
                    setEncryptedPayload(ciphertext);
                    setInputPayload(ciphertext);

                    // Renderizar QR Code
                    if (qrRef.current) {
                        qrRef.current.innerHTML = "";
                        new QRCode(qrRef.current, {
                            text: ciphertext,
                            width: 150,
                            height: 150,
                            colorDark: "#0f766e",
                            colorLight: "#ffffff",
                            correctLevel: QRCode.CorrectLevel.M
                        });
                    }
                } catch(e) {
                    // erro silencioso ou log
                }
            };

            const handleDecrypt = () => {
                try {
                    const bytes = CryptoJS.AES.decrypt(inputPayload, inputPin);
                    const originalText = bytes.toString(CryptoJS.enc.Utf8);
                    if (!originalText) throw new Error();
                    
                    const parsed = JSON.parse(originalText);
                    setDecryptedData(parsed);
                    setAuditLog(`Log CFP: Acesso seguro verificado | Sessão Profissional | ${new Date().toLocaleString('pt-BR')}`);
                } catch(e) {
                    alert('Falha na descriptografia! Verifique o PIN de segurança.');
                }
            };

            React.useEffect(() => {
                handleEncryptAndGenerate();
            }, []);

            return (
                <div className="flex flex-col flex-grow max-w-md w-full mx-auto bg-white min-h-screen shadow-xl border-x border-teal-100">
                    
                    {/* Header Institucional Gradiva */}
                    <header className="bg-teal-800 text-white p-4 sticky top-0 z-50 shadow border-b-4 border-teal-600">
                        <div className="flex justify-between items-center">
                            <div className="flex items-center space-x-2.5">
                                <div className="bg-teal-600 text-white w-9 h-9 rounded-xl font-black text-sm flex items-center justify-center shadow border border-teal-500">
                                    GV
                                </div>
                                <div>
                                    <h1 className="text-sm font-extrabold tracking-tight leading-tight">Instituto Gradiva</h1>
                                    <p className="text-[10px] text-teal-200">Prontuário & Saúde Mental • LGPD</p>
                                </div>
                            </div>
                            <span className="bg-teal-700 text-teal-100 text-[10px] font-bold px-2.5 py-1 rounded-xl border border-teal-600">
                                Sigilo Profissional
                            </span>
                        </div>

                        {/* Abas */}
                        <div className="grid grid-cols-2 gap-1 mt-3 bg-teal-950 p-1 rounded-xl">
                            <button onClick={() => setActiveTab('patient')} className={`py-2 text-xs font-bold rounded-lg transition ${activeTab === 'patient' ? 'bg-teal-600 text-white shadow' : 'text-teal-300 hover:text-white'}`}>
                                👤 Portal do Paciente
                            </button>
                            <button onClick={() => setActiveTab('therapist')} className={`py-2 text-xs font-bold rounded-lg transition ${activeTab === 'therapist' ? 'bg-teal-600 text-white shadow' : 'text-teal-300 hover:text-white'}`}>
                                🩺 Terminal Clínico
                            </button>
                        </div>
                    </header>

                    {/* Conteúdo Principal */}
                    <main className="p-4 flex-grow space-y-4 pb-24">
                        
                        {activeTab === 'patient' ? (
                            <div className="space-y-4">
                                <div className="bg-teal-50/50 p-4 rounded-2xl shadow-sm border border-teal-100 space-y-3">
                                    <h2 className="text-xs font-extrabold text-teal-900 uppercase tracking-wide">Ficha Terapêutica & Identificação</h2>
                                    
                                    <div>
                                        <label className="block text-[11px] font-semibold text-teal-800 mb-1">Nome Completo</label>
                                        <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full p-2.5 bg-white border border-teal-200 rounded-xl text-xs font-medium outline-none focus:ring-2 focus:ring-teal-600"/>
                                    </div>

                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-[11px] font-semibold text-teal-800 mb-1">Registro / ID</label>
                                            <input type="text" value={recordId} onChange={e => setRecordId(e.target.value)} className="w-full p-2.5 bg-white border border-teal-200 rounded-xl text-xs font-mono outline-none"/>
                                        </div>
                                        <div>
                                            <label className="block text-[11px] font-semibold text-teal-800 mb-1">Profissional Responsável</label>
                                            <input type="text" value={therapist} onChange={e => setTherapist(e.target.value)} className="w-full p-2.5 bg-white border border-teal-200 rounded-xl text-xs font-medium outline-none"/>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-[11px] font-semibold text-teal-800 mb-1">Programa / Acompanhamento</label>
                                        <input type="text" value={program} onChange={e => setProgram(e.target.value)} className="w-full p-2.5 bg-white border border-teal-200 rounded-xl text-xs font-medium outline-none"/>
                                    </div>

                                    <div>
                                        <label className="block text-[11px] font-semibold text-teal-800 mb-1">Orientações & Evolução Recente</label>
                                        <textarea rows="2" value={notes} onChange={e => setNotes(e.target.value)} className="w-full p-2.5 bg-white border border-teal-200 rounded-xl text-xs outline-none"></textarea>
                                    </div>

                                    <div>
                                        <label className="block text-[11px] font-semibold text-teal-900 mb-1">🔑 PIN de Criptografia Gradiva (AES-256)</label>
                                        <input type="password" value={secretPin} onChange={e => setSecretPin(e.target.value)} className="w-full p-2.5 bg-teal-100/50 border border-teal-300 rounded-xl text-xs font-mono outline-none"/>
                                    </div>

                                    <button onClick={handleEncryptAndGenerate} className="w-full bg-teal-700 active:bg-teal-800 text-white font-bold py-3 rounded-xl text-xs shadow transition">
                                        🔒 Criptografar e Atualizar Credencial
                                    </button>
                                </div>

                                <div className="bg-teal-50/50 p-4 rounded-2xl shadow-sm border border-teal-100 flex flex-col items-center text-center space-y-3">
                                    <h3 className="text-xs font-bold text-teal-900">QR Code de Credenciamento Gradiva</h3>
                                    <div className="bg-white p-3 rounded-xl border border-teal-200 flex justify-center shadow-sm" ref={qrRef}></div>
                                    <p className="text-[10px] text-slate-500 leading-tight">Apresente este código na recepção ou ao terapeuta para acesso rápido e seguro aos registros.</p>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-4">
                                <div className="bg-teal-50/50 p-4 rounded-2xl shadow-sm border border-teal-100 space-y-3">
                                    <h2 className="text-xs font-extrabold text-teal-900 uppercase tracking-wide">Terminal Profissional / Terapeuta</h2>
                                    
                                    <div>
                                        <label className="block text-[11px] font-semibold text-teal-800 mb-1">Payload Cifrado (Credencial Gradiva)</label>
                                        <textarea rows="3" value={inputPayload} onChange={e => setInputPayload(e.target.value)} className="w-full p-2.5 bg-white border border-teal-200 rounded-xl text-[10px] font-mono outline-none"></textarea>
                                    </div>

                                    <div>
                                        <label className="block text-[11px] font-semibold text-teal-800 mb-1">🔑 PIN de Acesso Profissional</label>
                                        <input type="password" value={inputPin} onChange={e => setInputPin(e.target.value)} className="w-full p-2.5 bg-white border border-teal-200 rounded-xl text-xs font-mono outline-none"/>
                                    </div>

                                    <button onClick={handleDecrypt} className="w-full bg-teal-800 active:bg-teal-900 text-white font-bold py-3 rounded-xl text-xs shadow transition">
                                        🔓 Descriptografar Prontuário
                                    </button>
                                </div>

                                {decryptedData && (
                                    <div className="space-y-3">
                                        <div className="bg-teal-50 border-l-4 border-teal-700 p-4 rounded-r-xl shadow-sm space-y-2">
                                            <div className="flex justify-between items-center">
                                                <span className="text-[10px] font-bold bg-teal-200 text-teal-900 px-2 py-0.5 rounded">REGISTRO CONFIDENCIAL</span>
                                                <span className="text-xs font-extrabold text-teal-800 font-mono">{decryptedData.recordId}</span>
                                            </div>
                                            <div className="text-xs space-y-1 text-slate-800">
                                                <p><strong>Paciente:</strong> <span className="font-bold text-teal-950">{decryptedData.name}</span></p>
                                                <p><strong>Programa:</strong> <span className="font-medium">{decryptedData.program}</span></p>
                                                <p><strong>Responsável:</strong> <span className="font-medium">{decryptedData.therapist}</span></p>
                                            </div>
                                        </div>

                                        <div className="bg-white border border-teal-200 p-4 rounded-xl shadow-sm text-xs space-y-1">
                                            <p className="font-bold text-teal-900 uppercase text-[10px]">Anotações Terapêuticas & Evolução</p>
                                            <p className="text-slate-700 leading-relaxed">{decryptedData.notes}</p>
                                        </div>

                                        <div className="bg-slate-900 text-teal-300 p-3 rounded-xl text-[10px] font-mono border border-teal-900">
                                            <span className="text-white font-bold">🔒 Conformidade LGPD & CFP:</span><br/>
                                            <span>{auditLog}</span>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                    </main>

                    {/* Footer Nav Mobile */}
                    <nav className="bg-white border-t border-teal-100 py-3 px-6 fixed bottom-0 max-w-md w-full shadow-lg flex justify-around items-center z-50">
                        <button onClick={() => setActiveTab('patient')} className="flex flex-col items-center text-teal-800 font-semibold text-[10px]">
                            <span className="text-lg">👤</span>
                            <span>Paciente</span>
                        </button>
                        <button onClick={() => alert('Gradiva • Central de Atendimento & Suporte Clínico: atendimento@gradiva.org')} className="flex flex-col items-center text-teal-600 font-bold text-[10px] transform -translate-y-3 bg-teal-800 text-white p-2.5 rounded-full shadow-md border-2 border-white">
                            <span className="text-xl">💬</span>
                            <span>Suporte</span>
                        </button>
                        <button onClick={() => setActiveTab('therapist')} className="flex flex-col items-center text-slate-600 font-semibold text-[10px]">
                            <span className="text-lg">🩺</span>
                            <span>Clínica</span>
                        </button>
                    </nav>

                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
